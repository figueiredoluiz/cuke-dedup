name: Scheduled performance benchmark

on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-performance-benchmark
  cancel-in-progress: true

jobs:
  analysis:
    name: Analysis scalability profiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: scheduled-performance-benchmark
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: cargo +stable build --release --locked
      - name: Record performance benchmark
        run: npm run --silent benchmark > benchmark.json
      - name: Enforce deterministic and resource budgets
        run: npm run --silent benchmark:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cuke-dedup-performance-${{ github.run_id }}
          path: benchmark.json
          if-no-files-found: error

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version used in artifact names
        required: true
        default: 0.14.1
        type: string
      publish_release:
        description: Create a GitHub release and enable configured registry publishing
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing version tag; required only when publishing
        required: false
        type: string
      publish_npm_only:
        description: Recover npm publishing without recreating the GitHub release or crate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_VERSION: ${{ inputs.version }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      toolchain: ${{ steps.metadata.outputs.toolchain }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate inputs and load checked-in metadata
        id: metadata
        shell: bash
        run: |
          release_sha=$(git rev-parse HEAD)
          RELEASE_SHA="$release_sha" node scripts/release/validate-release-context.mjs
          if [[ "$PUBLISH_RELEASE" == "true" ]] && ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "release_tag must name an existing tag" >&2
            exit 2
          fi
          EXPECTED_VERSION="$PACKAGE_VERSION" RELEASE_TAG="$RELEASE_TAG" \
            node scripts/check/check-release-version.mjs
          toolchain=$(sed -nE 's/^channel = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' rust-toolchain.toml)
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "rust-toolchain.toml must pin an exact Rust version" >&2; exit 1; }
          matrix=$(node scripts/release/release-matrix.mjs)
          {
            echo "toolchain=$toolchain"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.target }}
    needs: metadata
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_BINARY_NAME: ${{ matrix.binary }}
      RELEASE_PYTHON: ${{ matrix.python }}
      RELEASE_TARGET: ${{ matrix.target }}
      RUST_TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$RELEASE_TARGET"
      - name: Install musl build tools
        if: matrix.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - shell: bash
        run: cargo "+${RUST_TOOLCHAIN}" build --release --locked --target "$RELEASE_TARGET"
      - name: Verify release version
        shell: bash
        run: EXPECTED_VERSION="$PACKAGE_VERSION" node scripts/check/check-release-version.mjs
      - name: Smoke-test native binary
        if: runner.os != 'Windows'
        run: |
          "target/${RELEASE_TARGET}/release/${RELEASE_BINARY_NAME}" --version
      - name: Smoke-test native binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\target\$env:RELEASE_TARGET\release\$env:RELEASE_BINARY_NAME" --version
      - name: Create deterministic release assets
        shell: bash
        run: |
          "$RELEASE_PYTHON" scripts/release/package_release.py \
            --binary "target/${RELEASE_TARGET}/release/${RELEASE_BINARY_NAME}" \
            --target "$RELEASE_TARGET" \
            --version "$PACKAGE_VERSION" \
            --output dist
      - name: Verify checksum and smoke-test packaged binary
        shell: bash
        run: |
          "$RELEASE_PYTHON" scripts/release/verify_release.py --directory dist --version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          compression-level: 0

  release-comparison:
    name: Compare with previous release
    needs: build-native
    if: inputs.publish_release && !inputs.publish_npm_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A comparison failure must not block the release: the job then reports success to its dependents.
    continue-on-error: true
    permissions:
      contents: read
      attestations: read # gh attestation verify
    env:
      COMPARISON_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binary-${{ env.COMPARISON_TARGET }}
          path: candidate
      - name: Download the previous release binary
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The newest published release below the one being released, so a re-run or a backport
          # still compares against the release before it.
          published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
          previous_tag=$(printf '%s\n%s\n' "$published" "$RELEASE_TAG" \
            | sort -uV | awk -v tag="$RELEASE_TAG" '$0 == tag { found = prev } { prev = $0 } END { print found }')
          [[ -n "$previous_tag" ]] || { echo "no previous release to compare with" >&2; exit 1; }
          archive="cuke-dedup-${previous_tag}-${COMPARISON_TARGET}.tar.gz"
          gh release download "$previous_tag" --dir previous --pattern "$archive"
          # The binary is executed below: require build provenance from this repository's release workflow.
          gh attestation verify "previous/${archive}" --repo "$GH_REPO" \
            --signer-workflow "${GH_REPO}/.github/workflows/release.yml"
          tar -xzf "previous/${archive}" -C previous cuke-dedup
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Compare on the committed corpus
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          chmod +x candidate/cuke-dedup previous/cuke-dedup
          npm run release:compare -- \
            --previous previous/cuke-dedup --candidate candidate/cuke-dedup \
            --previous-label "$PREVIOUS_TAG" --candidate-label "$RELEASE_TAG" \
            --markdown release-comparison.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Not `release-*`: the publish jobs download that pattern as release assets.
          name: comparison-table
          path: release-comparison.md
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [build-native, release-comparison]
    if: inputs.publish_release && !inputs.publish_npm_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Sign archives and checksums with keyless Sigstore
        shell: bash
        run: |
          for asset in dist/*.tar.gz dist/*.zip dist/*.sha256; do
            test -f "$asset" || continue
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - name: Attest native build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Add provenance bundle to release assets
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/cuke-dedup.intoto.jsonl
      - run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # The comparison is informational: neither step may fail the release.
      - name: Download the comparison table
        id: comparison
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: comparison-table
          path: comparison
      - name: Append the comparison to the release notes
        if: steps.comparison.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        id: append
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > notes.md
          printf '\n' >> notes.md
          cat comparison/release-comparison.md >> notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md
      - name: Warn when the comparison is missing from the release notes
        if: steps.comparison.outcome == 'failure' || steps.append.outcome == 'failure'
        run: echo "::warning::The release was published without the comparison table; see the release-comparison job and the steps above."

  publish-crate:
    name: Publish crate
    needs: [metadata, build-native, github-release]
    if: inputs.publish_release && !inputs.publish_npm_only && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RUST_TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Authenticate with crates.io trusted publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - run: cargo "+${RUST_TOOLCHAIN}" publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  publish-npm:
    name: Publish npm packages
    needs: [metadata, build-native, github-release]
    if: >-
      ${{
        !cancelled() &&
        inputs.publish_release &&
        vars.PUBLISH_NPM == 'true' &&
        needs.metadata.result == 'success' &&
        needs.build-native.result == 'success' &&
        (inputs.publish_npm_only || needs.github-release.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          path: native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: RELEASE_TAG="$RELEASE_TAG" node scripts/check/check-release-version.mjs
      - run: node scripts/release/release-matrix.mjs >/dev/null
      - run: python3 scripts/release/verify_npm_binaries.py --binaries native --archives release-assets
      - run: node scripts/release/prepare-npm-packages.mjs native
      - run: npm ci --ignore-scripts --force
      - name: Verify npm trusted-publishing support
        run: node scripts/release/check-npm-trusted-publishing.mjs
      - name: Publish platform packages, then launcher
        run: node scripts/release/publish-npm-packages.mjs

  # Asks the website repository to rebuild once the release is out. It waits for the registries so
  # the site never advertises a version nobody can install yet. It cannot block them: a failure
  # here unpublishes nothing, and the job can be re-run on its own. A normal publish triggers it
  # after the GitHub release; an npm-only recovery triggers it once the packages land.
  # It does not depend on `release-comparison`, which is informational.
  #
  # `SITE_DISPATCH_TOKEN` is a fine-grained personal access token for the website repository only,
  # with `Contents: read and write` (what `repository_dispatch` requires). A cross-repository
  # dispatch cannot use OIDC. The token and the tag reach the shell through `env`, never by
  # interpolation into the script.
  notify-site:
    name: Trigger website rebuild
    needs: [github-release, publish-crate, publish-npm]
    if: >-
      ${{
        !cancelled() &&
        inputs.publish_release &&
        (needs.github-release.result == 'success' ||
          (inputs.publish_npm_only && needs.publish-npm.result == 'success')) &&
        (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped') &&
        (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger website rebuild
        shell: bash
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set; the release is published, so re-run this job once it is"
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like vX.Y.Z to notify the website"
            exit 1
          fi
          payload=$(jq -nc --arg tag "$RELEASE_TAG" '{event_type: "release-published", client_payload: {tag: $tag}}')
          # Sent once: the POST is not idempotent. Re-run the job instead of retrying inline.
          status=$(curl -sS --max-time 30 -X POST -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/figueiredoluiz/cuke-dedup-site/dispatches \
            -d "$payload") || status=000
          if [ "$status" != "204" ]; then
            echo "::error::dispatch returned HTTP $status: $(cat "$RUNNER_TEMP/dispatch.json" 2>/dev/null || true)"
            exit 1
          fi

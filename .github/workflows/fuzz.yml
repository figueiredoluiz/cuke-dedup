name: Scheduled parser fuzzing

on:
  schedule:
    - cron: "29 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-parser-fuzzing
  cancel-in-progress: true

jobs:
  parsers:
    name: Gherkin and TypeScript parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore the latest generated parser corpus
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          previous_run=$(gh run list --workflow fuzz.yml --limit 10 --json databaseId,status --jq '[.[] | select(.status == "completed")][0].databaseId // empty' 2>/dev/null || true)
          if [[ -n "$previous_run" ]]; then
            restored="$RUNNER_TEMP/parser-fuzz-corpus"
            if gh run download "$previous_run" --name parser-fuzz-corpus --dir "$restored"; then
              cp -R "$restored"/. fuzz/corpus/
            fi
          fi
      - run: rustup toolchain install nightly-2026-08-01 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: parser-fuzzing
          workspaces: fuzz -> target
      - name: Install cargo-fuzz reproducibly
        run: cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz public parser and input entrypoints
        run: |
          for target in parsers inputs; do
            cargo +nightly-2026-08-01 fuzz run "$target" -- \
              -max_total_time=150 -max_len=16384 -timeout=10 -rss_limit_mb=1024 -verbosity=0
          done
      - name: Preserve generated parser corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parser-fuzz-corpus
          path: fuzz/corpus/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: parser-fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

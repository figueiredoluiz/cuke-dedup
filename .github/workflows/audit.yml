name: Scheduled dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-dependency-audit
  cancel-in-progress: true

jobs:
  rust-policy:
    name: Rust vulnerability and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - run: cargo deny check advisories bans licenses sources
      - run: cargo deny --manifest-path fuzz/Cargo.toml check advisories bans licenses sources

  secret-history:
    name: Repository secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

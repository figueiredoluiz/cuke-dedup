[package]
name = "cuke-dedup"
version = "0.19.0"
edition = "2021"
rust-version = "1.100"
description = "Static analysis for duplicate and reusable Cucumber step definitions"
license = "MIT"
repository = "https://github.com/figueiredoluiz/cuke-dedup"
readme = "README.md"
keywords = ["cucumber", "gherkin", "lint", "testing", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
include = [
    "/src/**",
    "/tests/**",
    "/fixtures/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/docs/**",
    "/LICENSE",
    "/SECURITY.md",
]

[lib]
name = "cuke_dedup"
path = "src/lib.rs"

[[bin]]
name = "cuke-dedup"
path = "src/main.rs"

[features]
# Test tooling: records every Ruby source the adapter reads into the directory named by
# `CUKE_DEDUP_RUBY_SOURCE_CAPTURE`, for compilation under real Ruby. Not for release builds.
ruby-source-capture = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cucumber-expressions = { version = "0.5", features = ["into-regex"] }
erased-serde = "0.4"
globset = "0.4"
gherkin = "0.16"
ignore = "0.4"
regex = "1.11"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strsim = "0.11"
tempfile = "3.20"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-ruby = "0.23.1"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"
yaml_serde = "0.10"

[target.'cfg(unix)'.dependencies]
getrandom = { version = "0.4", features = ["std"] }
rustix = { version = "1", features = ["fs", "process"] }
# `O_NONBLOCK`, so opening an existing fingerprint destination never waits on a FIFO.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
cap-primitives = "4.0.3"

[target.'cfg(not(unix))'.dependencies]
# File identity without read access; Unix compares device and inode from metadata instead.
same-file = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
# Aborting on panic drops the unwinding tables and landing pads, and stripping removes the symbol
# table. Together they cut the published archive for each platform by about 21% with no measured
# analysis cost. CukeDedup reports expected failures through exit codes and `anyhow::Result`, so
# nothing depends on unwinding. Fat LTO with one codegen unit was measured too: it saves only
# another 2.7 points of download while tripling build time across the eight release targets.
panic = "abort"
strip = "symbols"

[profile.mutants]
inherits = "test"
debug = "none"
